name: MySQL driver and Red suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run driver and upstream Red tests on MySQL 8.4
        run: |
          mkdir -p test-results
          docker compose up --build --abort-on-container-exit --exit-code-from tests 2>&1 | tee test-results/mysql.log
      - name: Save test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-results
          path: test-results/mysql.log
      - name: Clean up
        if: always()
        run: docker compose down --volumes
